[package]
name = "rust_lib_aml"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# rustls rather than native-tls/openssl: pure-Rust TLS cross-compiles cleanly
# to Android (and Linux/macOS) without a C OpenSSL build.
reqwest = { version = "0.11", default-features = false, features = ["stream", "json", "gzip", "multipart", "socks", "rustls-tls"] }
png = "0.17"
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
once_cell = "1.19"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
zip = "0.6"
tar = "0.4"
xz2 = "0.1"
regex = "1.0"
sysinfo = "0.32"
serde_json = "1.0"
data-url = "0.3.1"
quartz_nbt = { version = "0.2.9", features = ["serde"] }
fastanvil = "0.32"
uuid = { version = "1.18.0", features = ["v4", "serde"] }
url = "2.5.4"
tracing = "0.1.41"
bytes = "1.10.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
dashmap = "6.1"
hex = "0.4"
urlencoding = "2.1"
base64 = "0.22"
rand = "0.8"
dunce = "1.0"
quick-xml = { version = "0.41.0", features = ["async-tokio"] }
shell-words = "1.1.1"
fs4 = { version = "0.12", features = ["sync"] }
hickory-resolver = "0.25"
xattr = "1"

[build-dependencies]
dunce = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.9"
jni = "0.21"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Pojavexec is a separate Android-only cdylib (the GLFW/EGL bridge). It is
# built on demand and is not part of the Cargokit-driven `rust_lib_aml` build.
[workspace]
members = [".", "pojavexec"]
